<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--banner-bg, #f8fafc)"/>
      <stop offset="42%" stop-color="var(--banner-mid, #eef4ff)"/>
      <stop offset="100%" stop-color="var(--banner-bg, #f8fafc)"/>
    </linearGradient>

    <!-- Card Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="gitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>

    <filter id="cicdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.18"/>
    </filter>

    <!-- Isometric Cube Gradients for CI/CD Center -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <style>
    .title-main { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; letter-spacing: 0.08em; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 16px; fill: #0f172a; }
    .card-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #475569; }
    .code-text { font-family: 'ui-monospace', 'Cascadia Code', monospace; font-size: 12px; fill: #1e293b; }
    .code-green { fill: #047857; font-weight: 700; }
    .simple-line {
      stroke: #2563eb;
      stroke-width: 2.5;
      stroke-dasharray: 7 6;
      opacity: 0.9;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle Light Grid -->
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500" />
    <path d="M 200,0 L 200,600 M 400,0 L 400,600 M 600,0 L 600,600 M 800,0 L 800,600" stroke-dasharray="3 3"/>
  </g>

  <!-- Title Header -->
  <text x="500" y="42" text-anchor="middle" class="title-main">END-TO-END AUTOMATION FLOW</text>

  <!-- Pipeline Passed Badge (Top Right) -->
  <g transform="translate(770, 22)">
    <rect width="170" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="15" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#334155">Pipeline Passed</text>
    <rect x="105" y="14" width="50" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="105" y="14" width="42" height="6" rx="3" fill="#2563eb"/>
  </g>

  <!-- ==================== SIMPLE DASHED CONNECTIONS (---) ==================== -->
  <g class="simple-line">
    <!-- CI/CD -> Git Source -->
    <line x1="390" y1="160" x2="280" y2="160" />
    <!-- CI/CD -> AWS Cloud -->
    <line x1="610" y1="160" x2="720" y2="160" />
    <!-- CI/CD -> Databases -->
    <line x1="430" y1="210" x2="280" y2="430" />
    <!-- CI/CD -> ML/AI -->
    <line x1="500" y1="210" x2="500" y2="390" />
    <!-- CI/CD -> K8s & Rack Servers -->
    <line x1="570" y1="210" x2="720" y2="430" />
  </g>

  <!-- Connection Nodes / Bullet Points on Endpoints -->
  <g fill="#2563eb">
    <circle cx="280" cy="160" r="6"/>
    <circle cx="720" cy="160" r="6"/>
    <circle cx="280" cy="430" r="6"/>
    <circle cx="500" cy="390" r="6"/>
    <circle cx="720" cy="430" r="6"/>
  </g>


  <!-- ==================== TOP CENTER: CI/CD HERO NODE ==================== -->
  <g transform="translate(390, 95)" filter="url(#cicdGlow)">
    <rect width="220" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    
    <!-- 3D Isometric Cube Visual -->
    <g transform="translate(110, 42)">
      <polygon points="0,-18 24,-6 0,6 -24,-6" fill="url(#cubeTop)"/>
      <polygon points="-24,-6 0,6 0,26 -24,14" fill="url(#cubeLeft)"/>
      <polygon points="0,6 24,-6 24,14 0,26" fill="url(#cubeRight)"/>
      <!-- Inner Icon on Cube Top -->
      <path d="M -6,-6 L 6,6 M 6,-6 L -6,6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="110" y="94" text-anchor="middle" class="card-title">CI/CD</text>
    <text x="110" y="110" text-anchor="middle" class="card-sub">Automation Engine</text>
  </g>


  <!-- ==================== 1. GIT SOURCE (TOP LEFT) ==================== -->
  <g transform="translate(60, 80)" filter="url(#gitGlow)">
    <rect width="220" height="160" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Git Icon Box -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#dbeafe"/>
    <path d="M 34,26 L 34,34 M 34,26 C 31,26 29,28 29,31 C 29,34 31,36 34,36 M 34,42 C 32.3,42 31,40.7 31,39" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="26" r="2.5" fill="#2563eb"/>
    <circle cx="34" cy="42" r="2.5" fill="#2563eb"/>
    <circle cx="29" cy="34" r="2.5" fill="#2563eb"/>

    <text x="62" y="32" class="card-title">Git Source</text>
    <text x="62" y="46" class="card-sub">Repository (Git)</text>

    <!-- Code Block -->
    <rect x="16" y="64" width="188" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <!-- Window Header Dots -->
    <circle cx="28" cy="74" r="3" fill="#ef4444"/>
    <circle cx="37" cy="74" r="3" fill="#f59e0b"/>
    <circle cx="46" cy="74" r="3" fill="#10b981"/>
    
    <text x="26" y="93" class="code-text code-green">✓ main branch</text>
    <text x="26" y="109" class="code-text">git push origin main</text>
    <text x="26" y="123" class="code-text">pipeline: start</text>
    <text x="26" y="135" class="code-text">status: queued</text>
  </g>


  <!-- ==================== 2. AWS CLOUD (TOP RIGHT) ==================== -->
  <g transform="translate(720, 80)" filter="url(#cardShadow)">
    <rect width="220" height="160" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#fef3c7"/>
    <text x="34" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#d97706">aws</text>

    <text x="62" y="32" class="card-title">AWS Cloud</text>
    <text x="62" y="46" class="card-sub">Infrastructure &amp; Data</text>

    <!-- AWS Micro Panels Grid -->
    <g transform="translate(16, 64)">
      <!-- Instances Section -->
      <rect x="0" y="0" width="90" height="80" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#b45309">Instances</text>
      <!-- CPU Box 1 -->
      <rect x="8" y="22" width="32" height="24" rx="4" fill="#ffffff" stroke="#f59e0b"/>
      <rect x="18" y="28" width="12" height="12" fill="#f59e0b" opacity="0.3"/>
      <!-- CPU Box 2 -->
      <rect x="48" y="22" width="32" height="24" rx="4" fill="#ffffff" stroke="#f59e0b"/>
      <rect x="58" y="28" width="12" height="12" fill="#f59e0b" opacity="0.3"/>
      <rect x="8" y="50" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="48" y="50" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>

      <!-- Buckets Section -->
      <rect x="98" y="0" width="90" height="80" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="106" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#b45309">Buckets</text>
      <rect x="106" y="22" width="32" height="24" rx="4" fill="#ffffff" stroke="#f59e0b"/>
      <path d="M 118,30 L 126,30 L 124,38 L 120,38 Z" fill="none" stroke="#d97706" stroke-width="1.5"/>
      <rect x="146" y="22" width="32" height="24" rx="4" fill="#ffffff" stroke="#f59e0b"/>
      <path d="M 158,30 L 166,30 L 164,38 L 160,38 Z" fill="none" stroke="#d97706" stroke-width="1.5"/>
      <rect x="106" y="50" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="146" y="50" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    </g>
  </g>


  <!-- ==================== 3. DATABASES (BOTTOM LEFT) ==================== -->
  <g transform="translate(60, 370)" filter="url(#cardShadow)">
    <rect width="220" height="160" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#dbeafe"/>
    <!-- DB Icon -->
    <path d="M 26,26 C 26,24.5 34,24.5 34,24.5 C 34,24.5 42,24.5 42,26 L 42,30 C 42,31.5 34,31.5 34,31.5 C 34,31.5 26,31.5 26,30 Z M 26,30 C 26,31.5 34,31.5 34,31.5 C 34,31.5 42,31.5 42,30 M 26,34 C 26,35.5 34,35.5 34,35.5 C 34,35.5 42,35.5 42,34 M 26,38 C 26,39.5 34,39.5 34,39.5 C 34,39.5 42,39.5 42,38" stroke="#1d4ed8" stroke-width="1.8" fill="none"/>

    <text x="62" y="32" class="card-title">Databases</text>
    <text x="62" y="46" class="card-sub">SQL / NoSQL</text>

    <!-- Code Window -->
    <rect x="16" y="64" width="188" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="28" cy="74" r="3" fill="#ef4444"/>
    <circle cx="37" cy="74" r="3" fill="#f59e0b"/>
    <circle cx="46" cy="74" r="3" fill="#10b981"/>

    <text x="26" y="93" class="code-text">SELECT status</text>
    <text x="26" y="107" class="code-text">FROM deployments</text>
    <text x="26" y="121" class="code-text">WHERE env = "prod"</text>
    <text x="26" y="135" class="code-text code-green">✓ connected</text>
  </g>


  <!-- ==================== 4. ML / AI (BOTTOM CENTER) ==================== -->
  <g transform="translate(390, 370)" filter="url(#cardShadow)">
    <rect width="220" height="160" rx="12" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#f3e8ff"/>
    <!-- Neural Network Icon -->
    <circle cx="34" cy="26" r="3" fill="#7e22ce"/>
    <circle cx="26" cy="38" r="3" fill="#7e22ce"/>
    <circle cx="42" cy="38" r="3" fill="#7e22ce"/>
    <line x1="34" y1="26" x2="26" y2="38" stroke="#7e22ce" stroke-width="1.5"/>
    <line x1="34" y1="26" x2="42" y2="38" stroke="#7e22ce" stroke-width="1.5"/>

    <text x="62" y="32" class="card-title">ML/AI</text>
    <text x="62" y="46" class="card-sub">(Machine Learning &amp; AI)</text>

    <!-- Code Window -->
    <rect x="16" y="64" width="188" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="28" cy="74" r="3" fill="#ef4444"/>
    <circle cx="37" cy="74" r="3" fill="#f59e0b"/>
    <circle cx="46" cy="74" r="3" fill="#10b981"/>

    <text x="24" y="91" font-family="monospace" font-size="9" fill="#6b21a8">ml_training_job {</text>
    <text x="24" y="103" font-family="monospace" font-size="8.5" fill="#334155">  model_type = "classifier"</text>
    <text x="24" y="115" font-family="monospace" font-size="8.5" fill="#334155">  compute = "K8s Cluster"</text>
    <text x="24" y="127" font-family="monospace" font-size="8.5" fill="#16a34a">  state = "COMPLETED"</text>
    <text x="24" y="137" font-family="monospace" font-size="8.5" fill="#6b21a8">}</text>
  </g>


  <!-- ==================== 5. K8S & RACK SERVERS (BOTTOM RIGHT) ==================== -->
  <g transform="translate(720, 370)" filter="url(#cardShadow)">
    <rect width="220" height="160" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#dbeafe"/>
    <!-- K8s Wheel Icon -->
    <circle cx="34" cy="34" r="8" stroke="#1d4ed8" stroke-width="2" fill="none"/>
    <circle cx="34" cy="34" r="3" fill="#1d4ed8"/>

    <text x="62" y="30" class="card-title">K8s &amp; Rack</text>
    <text x="62" y="44" class="card-sub">Automation Engine</text>

    <!-- Rack Server Component Display -->
    <g transform="translate(16, 64)">
      <rect x="0" y="0" width="188" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      
      <!-- Server Rack Lines -->
      <rect x="12" y="14" width="60" height="14" rx="3" fill="#0f172a"/>
      <circle cx="20" cy="21" r="2" fill="#38bdf8"/>
      <circle cx="26" cy="21" r="2" fill="#38bdf8"/>

      <rect x="12" y="33" width="60" height="14" rx="3" fill="#0f172a"/>
      <circle cx="20" cy="40" r="2" fill="#38bdf8"/>
      <circle cx="26" cy="40" r="2" fill="#38bdf8"/>

      <rect x="12" y="52" width="60" height="14" rx="3" fill="#0f172a"/>
      <circle cx="20" cy="59" r="2" fill="#38bdf8"/>

      <!-- Node Status Lines -->
      <line x1="72" y1="21" x2="95" y2="21" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="98" cy="21" r="3" fill="#16a34a"/>
      <text x="106" y="24" font-family="monospace" font-size="9" font-weight="600" fill="#16a34a">node-01 [ACTIVE]</text>

      <line x1="72" y1="40" x2="95" y2="40" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="98" cy="40" r="3" fill="#16a34a"/>
      <text x="106" y="43" font-family="monospace" font-size="9" font-weight="600" fill="#16a34a">node-02 [ACTIVE]</text>
    </g>
  </g>
</svg>
